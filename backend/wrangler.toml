name = "root-archive-lite"
main = "worker.js"
compatibility_date = "2026-11-24"
workers_dev = false
preview_urls = false
keep_vars = true

[[routes]]
pattern = "api-lite.rootamman.com"
custom_domain = true

[[routes]]
pattern = "assets-lite.rootamman.com"
custom_domain = true

[vars]
ASSET_ORIGIN = "https://assets-lite.rootamman.com"
ALLOWED_ORIGIN = "https://archive-lite.rootamman.com"
GOOGLE_CLIENT_ID = "451085424306-tll56iseq0qd9lcofeb1nkiqiaq0opvh.apps.googleusercontent.com"
STUDENT_EMAIL_DOMAIN = "std.aum.edu.jo"
# University Google Workspace hosted domain, confirmed by project owner.
GOOGLE_HOSTED_DOMAIN = "std.aum.edu.jo"
# ADMIN_EMAILS is configured as a Worker secret, not stored in this public repository.
# Optional comma-separated allowlist; applies to all writes, including admin writes.
DEMO_EMAILS = ""
MAX_FILE_MB = "10"

[[d1_databases]]
binding = "DB"
database_name = "root-archive-lite-db"
database_id = "6da50390-2a11-4486-a8a1-86513b44e372"

[[r2_buckets]]
binding = "FILES"
bucket_name = "root-archive-lite-files"
