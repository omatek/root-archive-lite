name = "root-archive-lite"
main = "worker.js"
compatibility_date = "2026-11-24"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "api-lite.rootamman.com"
custom_domain = true

[[routes]]
pattern = "assets-lite.rootamman.com"
custom_domain = true

[vars]
ASSET_ORIGIN = "https://assets-lite.rootamman.com"
ALLOWED_ORIGIN = "https://archive-lite.rootamman.com"
GOOGLE_CLIENT_ID = "REPLACE_WITH_LITE_CLIENT_ID.apps.googleusercontent.com"
STUDENT_EMAIL_DOMAIN = "std.aum.edu.jo"
# Confirm actual Google Workspace hd value with the university before enabling uploads.
GOOGLE_HOSTED_DOMAIN = "REPLACE_WITH_ACTUAL_WORKSPACE_DOMAIN"
ADMIN_EMAILS = ""
# Optional comma-separated allowlist; applies to all writes, including admin writes.
DEMO_EMAILS = ""
MAX_FILE_MB = "10"

[[d1_databases]]
binding = "DB"
database_name = "root-archive-lite-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "FILES"
bucket_name = "root-archive-lite-files"
